# NS Codex — nginx
#
# Front estático + proxy da API. O front do NS Codex é HTML/CSS/JS puro, sem
# build: o deploy copia os arquivos do repositório como estão.
#
# ⚠ LEIA ANTES DE PUBLICAR O FRONT
# Enquanto não houver autenticação (passo 3 da ordem de ataque), o front NÃO deve
# ir para um servidor alcançável. Não é zelo excessivo: Referencias/clientes.json
# tem 3.797 CNPJs com razão social, e assets/js/dados.js carrega uma cópia
# embutida dos mesmos dados. Publicar o front hoje é publicar a carteira.
# Por isso o bloco `location /` está COMENTADO e o deploy exige PUBLICAR_FRONT=1.
#
# TLS: o certificado wildcard *.nstech.com.br é o mesmo que a nsView usa. O .crt
# precisa conter FOLHA + INTERMEDIÁRIA, nessa ordem — cadeia incompleta dá
# CERTIFICATE_VERIFY_FAILED em curl e apps, e o navegador às vezes disfarça.
# O procedimento de reconstruir a cadeia está em infra/nginx/ da nsView.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # /health em HTTP para o health check interno e diagnóstico por IP.
    location /health {
        proxy_pass http://127.0.0.1:5055/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nstech.crt;
    ssl_certificate_key /etc/nginx/ssl/nstech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /var/www/ns-codex;
    index index.html;

    client_max_body_size 200M;   # upload de planilha

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # importação longa
    }

    location /health {
        proxy_pass http://127.0.0.1:5055/health;
    }

    # Os JSON de referência nunca são servidos como arquivo: quem responde por
    # catálogo é /api/ref/*, que passa por autenticação. Mesmo depois que o front
    # subir, esta negação fica — é o que impede alguém de baixar a carteira
    # inteira adivinhando a URL.
    location /Referencias/ {
        return 404;
    }

    # ⚠ DESCOMENTAR SÓ DEPOIS DA AUTENTICAÇÃO (ver o aviso no topo).
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    location / {
        return 404;
    }
}
