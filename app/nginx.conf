server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Probe do Kubernetes (liveness/readiness) — endpoint próprio, fora do
  # fallback de SPA abaixo, então nunca depende do React ter carregado.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Arquivos que o build do Vite já nomeia com hash (main-a1b2c3.js) podem
  # cachear para sempre: nome novo cada vez que o conteúdo muda.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca cacheia — é ele que aponta para o JS/CSS com hash da vez.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fallback de SPA: qualquer rota (ex: /dashboard, /cadastros/contas)
  # cai no index.html e o React Router assume a partir daí.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
