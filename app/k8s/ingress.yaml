apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ns-budget
  annotations:
    # Troque pelas anotações do seu ingress controller. Os exemplos abaixo
    # servem para ingress-nginx + cert-manager, que é o par mais comum —
    # apague/ajuste se o cluster usar outro (Traefik, ALB, etc.).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - budget.SEUDOMINIO.com.br
      secretName: ns-budget-tls
  rules:
    - host: budget.SEUDOMINIO.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ns-budget
                port:
                  number: 80
