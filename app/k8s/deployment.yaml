apiVersion: apps/v1
kind: Deployment
metadata:
  name: ns-budget
  labels:
    app: ns-budget
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ns-budget
  template:
    metadata:
      labels:
        app: ns-budget
    spec:
      containers:
        - name: ns-budget
          # Troque pela imagem publicada no SEU registry (o build já embute
          # as chaves do Supabase — ver k8s/README.md antes de fazer o
          # `docker build`).
          image: SEU_REGISTRY/ns-budget:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # É HTML/CSS/JS estático atrás de nginx — pede pouco. Ajuste se o
            # cluster tiver LimitRange ou se o tráfego real pedir mais.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # readOnlyRootFilesystem exige volume gravável só onde o nginx
          # realmente escreve (cache, pid, logs). O resto da imagem continua
          # somente leitura.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
